<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>목자의 하루: 양 키우는 묵상</title>
  <meta name="description" content="매일의 말씀과 기도, 작은 선한 일로 양들을 돌보는 묵상 게임">
  <link rel="icon" href="icon.png">
  <style>
    :root {
      --bg: #fdf7ec;
      --card: #fffdf8;
      --ink: #4a3530;
      --muted: #8a7468;
      --line: #ead9c6;
      --accent: #5a3b33;
      --accent-ink: #fffdf8;
      --sky: #dbf0f8;
      --grass: #b4dc7a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #241b18;
        --card: #2f2420;
        --ink: #f3e7da;
        --muted: #bfa898;
        --line: #4a3a33;
        --accent: #f0c35a;
        --accent-ink: #2a1f1b;
        --sky: #2c4450;
        --grass: #3f5a2a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      line-height: 1.6;
    }
    main { max-width: 560px; margin: 0 auto; padding: 48px 16px 64px; }
    .hero {
      background: linear-gradient(var(--sky) 0 62%, var(--grass) 62% 100%);
      border: 2px solid var(--line);
      border-radius: 20px;
      padding: 28px 16px 22px;
      text-align: center;
    }
    .hero img {
      width: 112px; height: 112px;
      image-rendering: pixelated;
      border-radius: 24px;
      border: 3px solid var(--accent);
    }
    h1 { font-size: 1.5rem; margin: 20px 0 4px; }
    .lead { margin: 0; color: var(--muted); }
    .card {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 18px 16px;
      margin-top: 20px;
    }
    .card h2 { font-size: 1.05rem; margin: 0 0 8px; }
    .card p { margin: 0; }
    .links { display: grid; gap: 10px; margin-top: 20px; }
    .links a {
      display: block;
      text-align: center;
      padding: 12px 16px;
      border-radius: 14px;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    .links a.primary { background: var(--accent); color: var(--accent-ink); }
    footer { margin-top: 32px; text-align: center; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <img src="icon.png" alt="목자의 하루 앱 아이콘 — 웃는 양">
      <h1>목자의 하루</h1>
      <p class="lead">양 키우는 묵상</p>
    </section>

    <section class="card">
      <h2>매일의 말씀과 기도로 양을 돌봐요</h2>
      <p>오늘의 미션(묵상 · 기도 · 선한 일)을 하면 돌봄 물건을 받아 양들을 돌볼 수 있어요.
        계절과 날씨가 바뀌고, 새끼양이 태어나 자라며, 교회 목장 사람들과 함께 기도 제목을 나누고 양 한 마리를 함께 키울 수도 있어요.</p>
    </section>

    <nav class="links" aria-label="링크">
      <a class="primary" href="https://apps.apple.com/kr/app/id6831984662">App Store에서 받기</a>
      <a href="https://emerald-chinchilla-53e.notion.site/4111cbaa84b4807ab0aefdfad8d2b089">개인정보처리방침</a>
    </nav>

    <footer>© 2026 목자의 하루</footer>
  </main>
</body>
</html>
